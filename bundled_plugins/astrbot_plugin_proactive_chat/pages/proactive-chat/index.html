<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>主动消息管理端</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.__ASTRBOT_PLUGIN_PAGE_NATIVE = true;
        window.__PROACTIVE_AUTH_PENDING = true;
    </script>
    <script src="/api/plugin/page/bridge-sdk.js"></script>
</head>
<body>
    <div id="loading-skeleton" class="boot-loader">
        <div class="boot-loader__logo"><img src="logo.png" alt="logo"></div>
        <div class="boot-loader__title">主动消息管理端</div>
        <div class="boot-loader__subtitle" id="boot-text">正在连接管理接口...</div>
        <div class="boot-loader__progress"><div class="boot-loader__progress-bar"></div></div>
    </div>
    <div id="root"></div>
    <script>
        (() => {
            const resolveAssetUrl = (src) => {
                const resolved = new URL(src, document.baseURI);
                const current = new URL(location.href);
                if (resolved.origin === current.origin) {
                    for (const key of ['asset_token', 'theme']) {
                        const value = current.searchParams.get(key);
                        if (value) resolved.searchParams.set(key, value);
                    }
                }
                return resolved.href;
            };
            const showError = () => {
                document.getElementById('boot-text').textContent = '加载失败，请刷新页面重试';
            };
            const loadScript = (src) => new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = resolveAssetUrl(src);
                script.onload = resolve;
                script.onerror = () => reject(new Error('Unable to load WebUI asset'));
                document.head.appendChild(script);
            });
            // Only documentation diagrams require an external runtime.
            let mermaidPromise;
            window.ProactiveLoader = {
                resolveAssetUrl,
                showError,
                loadMermaid() {
                    if (window.mermaid) return Promise.resolve(window.mermaid);
                    if (!mermaidPromise) {
                        mermaidPromise = import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs')
                            .then(module => (window.mermaid = module.default))
                            .catch(error => { mermaidPromise = null; throw error; });
                    }
                    return mermaidPromise;
                },
            };
            // Download both bundles concurrently, execute only after dependencies.
            for (const src of ['js/vendor.bundle.js', 'js/app.bundle.js']) {
                const preload = document.createElement('link');
                preload.rel = 'preload';
                preload.as = 'script';
                preload.href = resolveAssetUrl(src);
                document.head.appendChild(preload);
            }
            const bridgeReady = window.AstrBotPluginPage?.ready();
            Promise.all([
                bridgeReady || Promise.reject(new Error('Plugin Page bridge unavailable')),
                loadScript('js/vendor.bundle.js').then(() => loadScript('js/app.bundle.js')),
            ]).then(() => {
                window.__PROACTIVE_AUTH_PENDING = false;
                window.dispatchEvent(new Event('auth-ready'));
                requestAnimationFrame(() => {
                    document.getElementById('loading-skeleton')?.remove();
                    performance.mark('proactive-ui-ready');
                });
            }).catch(showError);
        })();
    </script>
</body>
</html>
